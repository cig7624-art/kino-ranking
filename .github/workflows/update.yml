name: Update Ranking

on:
  schedule:
    # 매일 오전 9시 KST = 매일 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Commit CSV
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ranking_history.csv
          git commit -m "Update ranking" || echo "No changes"
          git push
