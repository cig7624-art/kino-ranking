name: Find Detail API

on:
  workflow_dispatch:

jobs:
  find-detail-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install playwright
          playwright install chromium

      - name: Find Detail API
        run: python find_detail_api.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: detail-graphql-calls
          path: detail_graphql_calls.json
