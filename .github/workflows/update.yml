name: Update Ranking

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run ranking scraper
        run: |
          python scrape.py

      - name: Run upcoming scraper
        run: |
          python scrape_upcoming.py

      - name: Commit CSV
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add ranking_history.csv upcoming_releases.csv debug_provider_ids.csv debug_upcoming_text.txt debug_upcoming_cards.csv debug_upcoming.png
          git commit -m "Update ranking and upcoming releases" || echo "No changes"
          git push
